<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глоссарий</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo">VL-EC-MQ</a>
        <nav class="nav">
            <a href="glossary.html" class="nav-link">Глоссарий</a>
            <div id="authButtons"></div>
        </nav>
    </div>
</header>

<div class="glossary-layout">
    <a href="index.html" class="back-link">← Назад</a>
    <div class="glossary-header">
        <h1 class="glossary-title">Глоссарий</h1>
        <input type="text" id="searchInput" class="auth-input glossary-search" placeholder="Поиск термина...">
    </div>

    <div id="glossaryList" class="glossary-list">
        <p class="loading-text">Загрузка...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, orderBy, onSnapshot, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDoRa8vf2rjzgRG4nhf46Ps0rfsy7Vkj14",
        authDomain: "vlecmq.firebaseapp.com",
        projectId: "vlecmq",
        storageBucket: "vlecmq.firebasestorage.app",
        messagingSenderId: "730050177884",
        appId: "1:730050177884:web:d4c7c17614b6aa51c96f99"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_EMAIL = "nopaknopanopefake@gmail.com";
    let isAdmin = false


    const snapshot = await getDocs(query(collection(db, "glossary"), orderBy("word")));
    let terms = [];
    snapshot.forEach(d => terms.push({ id: d.id, ...d.data() }));

    function renderTerms(list) {
        const container = document.getElementById("glossaryList");
        if (list.length === 0) {
            container.innerHTML = `<p class="loading-text">Ничего не найдено</p>`;
            return;
        }

        // группировка по первой букве
        const groups = {};
        list.forEach(term => {
            const letter = term.word[0].toUpperCase();
            if (!groups[letter]) groups[letter] = [];
            groups[letter].push(term);
        });

        container.innerHTML = "";
        Object.keys(groups).sort().forEach(letter => {
            container.innerHTML += `<div class="glossary-letter">${letter}</div>`;
            groups[letter].forEach(term => {
                container.innerHTML += `
                    <div class="glossary-item" id="term-${term.id}">
                        <div class="glossary-word">${term.word}</div>
                        <div class="glossary-short">${term.short}</div>
                        ${term.full ? `<div class="glossary-full">${term.full}</div>` : ""}
                    </div>
                `;
            });
        });
    }

    renderTerms(terms);

    // поиск
    document.getElementById("searchInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        renderTerms(terms.filter(t =>
            t.word.toLowerCase().includes(q) ||
            t.short.toLowerCase().includes(q)
        ));
    });

    // URL
    const hash = window.location.hash;
    if (hash) {
        setTimeout(() => {
            const el = document.querySelector(hash);
            if (el) el.scrollIntoView({ behavior: "smooth" });
        }, 500);
    }

    function loadNotifications(userId) {
        const q = query(
            collection(db, "notifications"),
            where("userId", "==", userId),
            where("read", "==", false)
        );

        onSnapshot(q, (snap) => {
            const count = snap.size;
            const countEl = document.getElementById("notifCount");
            if (countEl) {
                if (count > 0) {
                    countEl.textContent = count;
                    countEl.style.display = "inline";
                } else {
                    countEl.style.display = "none";
                }
            }

            const bell = document.getElementById("notifBell");
            if (bell) {
                bell.onclick = () => showNotifications(snap.docs, userId);
            }
        });
    }

    function showNotifications(docs, userId) {
        const existing = document.getElementById("notifDropdown");
        if (existing) { existing.remove(); return; }

        const dropdown = document.createElement("div");
        dropdown.id = "notifDropdown";
        dropdown.className = "notif-dropdown";

        if (docs.length === 0) {
            dropdown.innerHTML = `<p class="loading-text" style="padding:16px">Уведомлений нет</p>`;
        } else {
            docs.forEach(d => {
                const n = d.data();
                const date = n.createdAt?.toDate?.()?.toLocaleDateString("ru-RU") || "";
                dropdown.innerHTML += `
                <a href="${n.link}" class="notif-item" data-id="${d.id}">
                    <div class="notif-text">${n.text}</div>
                    <div class="notif-date">${date}</div>
                </a>
            `;
            });
            dropdown.innerHTML += `<button class="notif-clear" id="notifClear">Отметить все прочитанными</button>`;
        }

        document.getElementById("notifBell").after(dropdown);

        dropdown.querySelectorAll(".notif-item").forEach(item => {
            item.addEventListener("click", async () => {
                await updateDoc(doc(db, "notifications", item.dataset.id), { read: true });
            });
        });

        document.getElementById("notifClear")?.addEventListener("click", async () => {
            const updates = docs.map(d => updateDoc(doc(db, "notifications", d.id), { read: true }));
            await Promise.all(updates);
            dropdown.remove();
            document.getElementById("notifCount").style.display = "none";
        });

        document.addEventListener("click", (e) => {
            if (!dropdown.contains(e.target) && e.target.id !== "notifBell") {
                dropdown.remove();
            }
        }, { once: true });
    }

    onAuthStateChanged(auth, (user) => {
        const authButtons = document.getElementById("authButtons");
        if (user) {
            isAdmin = user.email === ADMIN_EMAIL;
            loadNotifications(user.uid);
            authButtons.innerHTML = `
            ${isAdmin ? '<a href="admin.html" class="nav-btn admin-btn">Админ</a>' : ''}
            <button class="notif-bell" id="notifBell">🔔 <span class="notif-count" id="notifCount" style="display:none">0</span></button>
            <a href="profile.html" class="nav-btn" style="background:transparent;border:1px solid var(--border);color:var(--text-muted)">Профиль</a>
            <button class="nav-btn logout-btn" id="logoutBtn">Выйти</button>
        `;
            document.getElementById("logoutBtn").addEventListener("click", async () => {
                await signOut(auth);
                window.location.reload();
            });
        } else {
            authButtons.innerHTML = `<a href="login.html" class="nav-btn">Войти</a>`;
        }
    });


</script>

</body>
</html>
